name: Bug Report
description: Report a bug or problem with ExtraGear
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Welcome to the ExtraGear issue tracker
        You are reporting a bug in **ExtraGear**, a Slimefun addon.
        Questions and suggestions are better asked on the [Slimefun Discord](https://discord.gg/fsD4Bkh).
        Please read [How to report bugs](https://github.com/Slimefun/Slimefun4/wiki/How-to-report-bugs) before submitting.

        <strong><i>Fields marked with an asterisk (*) are required.</i></strong>

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Before reporting, please confirm that
      options:
        - label: You are using an official build of ExtraGear and an official build of Slimefun
          required: true
        - label: You have not modified the downloaded files in any way
          required: true
        - label: You are using the latest version of ExtraGear and Slimefun
          required: true
        - label: You have searched the [existing issues](https://github.com/mybezo/ExtraGear/issues) and found no duplicate
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Describe the problem in as much detail as possible.
        Detailed information helps us resolve the issue faster.
      placeholder: Simply saying "it doesn't work" does not help us find the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Explain exactly how to reproduce the issue.
        If you have a video, please link it here.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: |
        What did you expect to happen?
        Sometimes an "issue" is just a misunderstanding of how a feature works.
    validations:
      required: true

  - type: input
    id: server-log
    attributes:
      label: Server log
      description: |
        Check your server log for errors. If there are any, upload the log to [https://mclo.gs](https://mclo.gs) and paste the link here.
        **Do not paste the log directly here.**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: input
    id: error-report
    attributes:
      label: Error report
      description: |
        If your server log mentions a file in `/plugins/Slimefun/error-reports`,
        upload it to [https://mclo.gs](https://mclo.gs) and paste the link here.
        **Do not paste the error report directly here.**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Run `/sf versions` in-game and paste or screenshot the **full output** here.
        If the command does not work, list your server software, Minecraft version, Slimefun version, ExtraGear version and installed plugins.
        If your client's Minecraft version differs from the server's, please mention it as well.
      placeholder: |
        (Paste the full output of /sf versions here, or fill it in manually)
    validations:
      required: true
